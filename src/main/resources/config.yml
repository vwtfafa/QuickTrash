trash:
  auto-clear-seconds: 30
valuable-items:
  enabled: true
  require-confirmation: true
  confirmation-timeout-seconds: 5
  mode: WHITELIST
  materials:
    - DIAMOND
    - EMERALD
    - NETHERITE_INGOT
    - NETHERITE_SWORD
    - NETHERITE_PICKAXE
    - ENCHANTED_GOLDEN_APPLE
messages:
  prefix: '<dark_gray>[<aqua>QuickTrash<dark_gray>] '
  trash-opened: '<gray>Trash opened.'
  trash-cleared: '<green>Your trash was cleared.'
  item-deleted: '<red>{amount}x {item} deleted.'
  valuable-warning: '<red>! This item is valuable!'
  confirmation-required: '<gray>Click again to permanently delete it.'
  no-permission: '<red>You do not have permission.'
  no-space: '<red>Your trash is full.'
  reload: '<green>Configuration reloaded.'
  version: '<gray>QuickTrash <white>{version}'
  stats: '<gray>Your deleted items: <white>{player}<gray>, server total: <white>{total}'
  player-only: '<red>Only players can use this command.'
  unknown-subcommand: '<red>Unknown subcommand. Available: <white>stats, version, reload'
gui:
  title: '<dark_gray>QuickTrash'
  info-name: '<aqua>QuickTrash'
  sounds:
    open: block.ender_chest.open
    delete: block.lava.extinguish
  info-lore:
    - '<gray>Items are deleted after <white>{seconds}s<gray>.'
    - '<gray>Shift-click an item to delete it now.'
